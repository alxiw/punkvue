# Server block for the SPA (mounted as /etc/nginx/conf.d/default.conf).
# It is included into the http block of the stock nginx config, so no http/events here.
server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Static hardening. add_header is inherited by locations only while they add none
  # of their own — that is why caching below is configured via `expires`.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml
             application/manifest+json;

  # Content-hashed bundles from the Vite build: a name never points to new content
  location ^~ /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # The stock mime.types has no mapping for .webmanifest, so the manifest would be
  # served as application/octet-stream. A `types` block is not an option here: inside
  # server/location it replaces the inherited mime.types instead of extending it, and
  # every other extension degrades to octet-stream. default_type covers the unknown
  # extension while leaving the inherited table intact.
  location = /site.webmanifest {
    default_type application/manifest+json;
    expires 30d;
  }

  # Icons and favicons keep their names between deploys
  location ~* \.(?:ico|png|svg)$ {
    expires 30d;
    try_files $uri =404;
  }

  # index.html must be revalidated, otherwise a new deploy stays invisible,
  # including after the `try_files` fallback below (an internal redirect re-matches).
  location = /index.html {
    expires -1;
  }

  # SPA history fallback: /366 is a client-side route, so unknown paths get the shell
  location / {
    try_files $uri $uri/ /index.html;
  }
}
